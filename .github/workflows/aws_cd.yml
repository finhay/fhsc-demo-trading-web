name: Deploy to Amazon ECS

on:
    release:
        types: [published]
env:
    CONTAINER_NAME: finhay-prod-fe-service-v2-container
    SERVICE_NAME: finhay-prod-fe-service-v2-ecs-service
    CLUSTER_NAME: finhay-prod-frontend-ecs-cluster
    ECR_REPOSITORY: finhay-fe-service-v2-repo
    ENV_FILE_NAME: site-prod.env
    BUCKET_NAME: finhay-environments
    PATH_ENV: fe-service-v2

    ENV_ABBR: prod
    GOOGLE_CHAT_WEBHOOK: 'https://chat.googleapis.com/v1/spaces/AAAAXAWH9_g/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=_Gb4MAZgegM5Jbwv3aaFbd6aHS4JUlms1nsCTHqIfDw%3D'

jobs:
    build:
        runs-on: ubuntu-20.04

        steps:
            - name: Checkout
              uses: actions/checkout@v2

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_CD }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_CD }}
                  aws-region: ap-southeast-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1
            - name: Download env file from S3 bucket
              uses: keithweaver/aws-s3-github-action@v1.0.0
              with:
                  command: cp
                  source: s3://${{ env.BUCKET_NAME }}/${{ env.PATH_ENV }}/${{ env.ENV_FILE_NAME }}
                  destination: ./.env
            - id: get_version
              uses: battila7/get-version-action@v2
            - name: Build, tag, and push image to Amazon ECR
              id: build-image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
                  IMAGE_TAG: ${{ steps.get_version.outputs.version }}
              run: |
                  # Build a docker container and
                  # push it to ECR so that it can
                  # be deployed to ECS.
                  docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                  echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            - name: Fill in the new image ID in the Amazon ECS task definition
              id: task-def
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                  task-definition: task-definition.json
                  container-name: ${{ env.CONTAINER_NAME }}
                  image: ${{ steps.build-image.outputs.image }}

            - name: Deploy Amazon ECS task definition
              uses: aws-actions/amazon-ecs-deploy-task-definition@v1
              with:
                  task-definition: ${{ steps.task-def.outputs.task-definition }}
                  service: ${{ env.SERVICE_NAME }}
                  cluster: ${{ env.CLUSTER_NAME }}
                  wait-for-service-stability: false
            - name: Google Chat Notification
              uses: Co-qn/google-chat-notification@releases/v1
              with:
                  name: Build
                  url: ${{ env.GOOGLE_CHAT_WEBHOOK }}
                  status: ${{ job.status }}
              if: always()
